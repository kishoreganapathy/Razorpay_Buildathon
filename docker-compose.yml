services:
  mysql:
    image: mysql:8.0
    container_name: negotiatepay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: negotiatepay
    ports:
      - "3306:3306"
    volumes:
      - negotiatepay_mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  negotiatepay_mysql:
